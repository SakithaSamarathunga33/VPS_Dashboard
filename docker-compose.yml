version: '3.8'

services:
  vps-dashboard:
    build: .
    container_name: vps-dashboard
    restart: unless-stopped
    environment:
      POLL_INTERVAL_SECONDS: 30
      DB_PATH: /data/vps-monitor.db
      PORT: 3000
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "3000"
    networks:
      - caddy_net

networks:
  caddy_net:
    external: true
